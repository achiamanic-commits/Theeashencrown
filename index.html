const store=(()=>{try{const k='__ashen_test__';localStorage.setItem(k,k);localStorage.removeItem(k);return localStorage}catch(e){const m={};return{getItem:k=>Object.prototype.hasOwnProperty.call(m,k)?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const STORY={"start": "p1", "scenes": {"p1": {"chapter": "Prologue — The Bell Without a Tongue", "passages": [{"k": "n", "x": "The night King Edric IV died, every bell in the kingdom of Veyr fell silent."}, {"k": "n", "x": "Not one after another. All seven bells stopped at precisely the same moment."}, {"k": "n", "x": "Horses reared. Candles guttered. In the cathedral, priests abandoned their prayers when the great bronze bell refused to answer the rope."}, {"k": "t", "x": "Beneath the Royal Palace"}, {"k": "n", "x": "Behind a door that had not been opened in three hundred years, something knocked. Three times."}, {"k": "d", "who": "The Voice", "x": "“The seventh king is dead. Bring me the first.”"}, {"k": "n", "x": "Nobody heard it except Mara Venn."}], "next": "p2"}, "p2": {"chapter": "Prologue — The Bell Without a Tongue", "passages": [{"k": "n", "x": "At twenty-two, Mara had spent most of her life among the dead things of Veyr—not bodies, but words."}, {"k": "n", "x": "History was a patient creature. It never complained when neglected. It simply waited."}, {"k": "n", "x": "That evening, a royal seal arrived, carried by a messenger whose horse had collapsed before reaching the palace gates."}, {"k": "d", "who": "Royal Order", "x": "“By command of the Crown Council, the contents of Vault Nine are to be destroyed before sunrise. No copies are to be made. No questions are to be asked.”"}], "next": "p3"}, "p3": {"chapter": "Prologue — The Bell Without a Tongue", "passages": [{"k": "n", "x": "Vault Nine did not exist on any official map. Yet beneath Mara’s desk lay an old drawing showing a staircase descending farther than the palace foundations allowed."}, {"k": "n", "x": "She took a lantern and followed it."}, {"k": "t", "x": "Vault Nine"}, {"k": "n", "x": "The staircase ended at a black iron door. There was no lock—only a sentence carved into the stone."}, {"k": "d", "who": "Carved Inscription", "x": "“Let the truth remain buried, lest the living inherit the sins of the dead.”"}, {"k": "n", "x": "Mara touched the inscription. The door opened inward."}, {"k": "n", "x": "Inside waited a table, a silver knife, and a book bound in grey leather. Its cover bore a crown with seven broken points."}], "next": "p4", "fx": [["gain", "Grey-Leather Chronicle"], ["gain", "Silver Knife"]]}, "p4": {"chapter": "Prologue — The Bell Without a Tongue", "passages": [{"k": "n", "x": "The first page was written in a hand Mara recognised."}, {"k": "d", "who": "Elira Venn", "x": "“My dearest Mara, if you are reading this, then the king is dead, and I have failed to keep you safe.”"}, {"k": "n", "x": "Her mother had died when Mara was seven. Or so she had been told."}, {"k": "d", "who": "Elira Venn", "x": "“They will tell you that Veyr was founded by seven noble houses, united by the courage of the first king. They will tell you many things.”"}, {"k": "d", "who": "Elira Venn", "x": "“There was no first king.”"}], "next": "p5"}, "p5": {"chapter": "Prologue — The Bell Without a Tongue", "passages": [{"k": "n", "x": "Footsteps sounded behind her. Mara turned, reaching for the silver knife."}, {"k": "n", "x": "A young man stood in the doorway, drenched by rain that had not fallen inside the palace for weeks."}, {"k": "d", "who": "Stranger", "x": "“You have her eyes.”"}, {"k": "d", "who": "Mara", "x": "“Who are you?”"}, {"k": "d", "who": "Oren", "x": "“My name is Oren. And I’m the reason your mother died.”"}, {"k": "n", "x": "Above them, one of the seven bells rang—a single, broken note."}, {"k": "d", "who": "Oren", "x": "“That wasn’t supposed to happen yet.”"}], "next": "p6"}, "p6": {"chapter": "Prologue — The Bell Without a Tongue", "passages": [{"k": "n", "x": "Oren produced a small wooden token, blackened at the edges and stamped with the broken crown."}, {"k": "d", "who": "Oren", "x": "“Your mother didn’t die twenty years ago, Mara. She died three days from now.”"}, {"k": "n", "x": "The lantern went out. From behind the walls, a child began to sing."}, {"k": "d", "who": "The Child’s Song", "x": "“Seven bells for seven lies, / Seven graves where truth now lies, / When the final bell is torn, / The child of ash shall be reborn.”"}, {"k": "n", "x": "Then something on the other side of the door whispered Mara’s name."}], "next": "c1a", "fx": [["gain", "Blackened Wooden Token"]]}, "c1a": {"chapter": "Chapter One — The Keeper of Forgotten Things", "passages": [{"k": "t", "x": "Chapter One\nThe Keeper of Forgotten Things"}, {"k": "n", "x": "By sunrise, the kingdom had invented three explanations for the king’s death."}, {"k": "n", "x": "When Mara returned to the archive, Chancellor Halvek was waiting."}, {"k": "d", "who": "Chancellor Halvek", "x": "“Mara Venn. Your superior speaks highly of you.”"}, {"k": "d", "who": "Mara", "x": "“My superior is dead.”"}, {"k": "d", "who": "Chancellor Halvek", "x": "“One more thing. You are relieved of your duties. You will remain in your quarters until the Crown Council concludes its inquiry.”"}, {"k": "d", "who": "Chancellor Halvek", "x": "“Tell me, Mara. Did you enter Vault Nine?”"}], "choices": [{"x": "“No. I have never heard of Vault Nine.”", "next": "c1c", "hint": "Deny everything.", "fx": [["susp", 1], ["flag", "deniedVault"]]}, {"x": "“I followed an order. I found an empty room.”", "next": "c1c", "hint": "Admit little.", "fx": [["flag", "partialTruth"]]}, {"x": "“You sealed it. Why ask me?”", "next": "c1c", "hint": "Turn the question on him.", "fx": [["susp", 2], ["flag", "challengedHalvek"]]}, {"x": "“I found my mother’s writing there.”", "next": "c1c", "hint": "Reveal a dangerous truth.", "fx": [["trust", 1], ["susp", 1], ["flag", "revealedMother"]]}]}, "c1c": {"chapter": "Chapter One — The Keeper of Forgotten Things", "passages": [{"k": "n", "x": "Halvek studied her, expressionless."}, {"k": "d", "who": "Chancellor Halvek", "x": "“Go to your quarters. Do not leave. Do not return to the archive.”"}, {"k": "n", "x": "Night settled. Then came a soft knock at Mara’s window."}, {"k": "n", "x": "Oren stood on the narrow ledge, rain running down his face."}, {"k": "d", "who": "Oren", "x": "“They know you were there. Give me the chronicle. I can take it beyond the palace before sunrise.”"}], "choices": [{"x": "Give Oren the chronicle.", "next": "c2a", "hint": "Trust him.", "fx": [["trust", 2], ["flag", "gaveChronicle"], ["lose", "Grey-Leather Chronicle"]]}, {"x": "Refuse. “You said you were the reason she died.”", "next": "c2a", "hint": "Withhold the book.", "fx": [["trust", -1], ["flag", "keptChronicle"]]}, {"x": "Ask about the token and your mother’s pendant.", "next": "c2a", "hint": "Seek truth first.", "fx": [["trust", 1], ["flag", "askedAboutToken"]]}, {"x": "Send him away and hide the chronicle.", "next": "c2a", "hint": "Survive alone.", "fx": [["flag", "hidChronicle"], ["susp", 1]]}]}, "c2a": {"chapter": "Chapter Two — The Hour of Ash", "passages": [{"k": "t", "x": "Chapter Two\nThe Hour of Ash"}, {"k": "n", "x": "Before Mara could answer, torchlight flared in the corridor below."}, {"k": "d", "who": "Guard", "x": "“Open the door in the name of the Crown Council!”"}, {"k": "d", "who": "Oren", "x": "“They are not here for questions. The old servants’ way leads beneath the palace.”"}], "choices": [{"x": "Flee with Oren.", "next": "c2b", "hint": "Escape now.", "fx": [["trust", 1], ["flag", "fledWithOren"]]}, {"x": "Hide the chronicle and face the guards.", "next": "c2b", "hint": "Buy time.", "fx": [["susp", 1], ["flag", "facedGuards"]]}, {"x": "Demand the truth before moving.", "next": "c2b", "hint": "Truth before escape.", "fx": [["trust", 1], ["flag", "demandedTruth"]]}]}, "c2b": {"chapter": "Chapter Two — The Hour of Ash", "passages": [{"k": "n", "x": "They descended a shaft of wet stone and rusted rungs. Behind them, Mara’s door splintered."}, {"k": "d", "who": "Oren", "x": "“The bells are not bells. They are locks.”"}, {"k": "d", "who": "Mara", "x": "“Locks against what?”"}, {"k": "d", "who": "Oren", "x": "“Against the thing your kingdom calls the first king. There was no first king—only the First, and the lie that kept it buried.”"}], "next": "c2c"}, "c2c": {"chapter": "Chapter Two — The Hour of Ash", "passages": [{"k": "n", "x": "They reached a cistern where seven stone channels met beneath a dome carved with broken crowns."}, {"k": "d", "who": "Oren", "x": "“Seven houses. Seven lies. Seven bells. Each bell binds one part of the First.”"}, {"k": "d", "who": "Oren", "x": "“Your mother was a Keeper. She tried to stop the Council from renewing the binding.”"}], "next": "c2d"}, "c2d": {"chapter": "Chapter Two — The Hour of Ash", "passages": [{"k": "n", "x": "At the cistern’s edge lay a dead keeper, his hand clutching a sealed letter bearing the broken crown."}], "choices": [{"x": "Take the sealed letter.", "next": "c3a", "hint": "Evidence may save lives.", "fx": [["gain", "Sealed Keeper’s Letter"], ["flag", "tookLetter"]]}, {"x": "Leave it undisturbed.", "next": "c3a", "hint": "Respect the dead.", "fx": [["flag", "leftLetter"]]}]}, "c3a": {"chapter": "Chapter Three — The Houses That Lie", "passages": [{"k": "t", "x": "Chapter Three\nThe Houses That Lie"}, {"k": "n", "x": "They reached the closed Venn townhouse. In her mother’s old study, a clean rectangle in the dust marked a hidden panel."}, {"k": "d", "who": "Oren", "x": "“She kept her real work here.”"}], "next": "c3b"}, "c3b": {"chapter": "Chapter Three — The Houses That Lie", "passages": [{"k": "n", "x": "The panel held a ledger listing the seven noble houses of Veyr—and beside each name, a single word."}, {"k": "n", "x": "Ash. Debt. Silence. Hunger. Name. Grave. Crown."}, {"k": "d", "who": "Mara", "x": "“These aren’t houses. They’re prisons.”"}, {"k": "n", "x": "Mara’s pendant grew warm. Pressed to the ledger, it opened a compartment holding white chalk and a note in her mother’s hand."}, {"k": "d", "who": "Elira Venn", "x": "“Do not let them make you a keeper, Mara. Keepers do not protect the truth. They protect the story.”"}], "next": "c3c", "fx": [["gain", "House Ledger"], ["gain", "Bell-keeper’s Chalk"]]}, "c3c": {"chapter": "Chapter Three — The Houses That Lie", "passages": [{"k": "n", "x": "A knock struck the front door. Then another—harder."}, {"k": "d", "who": "Oren", "x": "“Halvek’s men. The ledger cannot fall into their hands.”"}], "choices": [{"x": "Burn the ledger.", "next": "c3d", "hint": "Destroy the evidence.", "fx": [["lose", "House Ledger"], ["flag", "burnedLedger"]]}, {"x": "Take it and escape through the back.", "next": "c3d", "hint": "Keep the proof.", "fx": [["flag", "keptLedger"]]}, {"x": "Leave it open as a trap.", "next": "c3d", "hint": "Mislead them.", "fx": [["flag", "trapLedger"], ["susp", 1]]}]}, "c3d": {"chapter": "Chapter Three — The Houses That Lie", "passages": [{"k": "n", "x": "They escaped through the coal cellar. In the alley waited a woman in the grey robes of the cathedral’s bell-keepers."}, {"k": "d", "who": "Sister Ilsa", "x": "“You are Elira’s daughter. I keep the first bell. I have waited twenty years for someone to ask why it stopped.”"}], "next": "c4a", "fx": [["flag", "metIlsa"]]}, "c4a": {"chapter": "Chapter Four — The First Bell", "passages": [{"k": "t", "x": "Chapter Four\nThe First Bell"}, {"k": "n", "x": "In the cathedral undercroft, the first bell hung silent, split by a hairline fracture."}, {"k": "d", "who": "Sister Ilsa", "x": "“People think the bells mark the hours. They mark the binding. When one breaks, a chain loosens.”"}, {"k": "d", "who": "Sister Ilsa", "x": "“It will break fully by midnight unless it is resealed.”"}], "next": "c4b"}, "c4b": {"chapter": "Chapter Four — The First Bell", "passages": [{"k": "n", "x": "Ilsa spread the chalk in a circle of seven points."}, {"k": "d", "who": "Sister Ilsa", "x": "“The seal requires a Keeper’s blood and word. You would be choosing to continue the lie.”"}], "choices": [{"x": "Help Ilsa reseal the bell.", "next": "c4c", "hint": "Preserve the binding.", "fx": [["flag", "helpedIlsa"], ["susp", -1]]}, {"x": "Refuse. “I will not inherit her lie.”", "next": "c4c", "hint": "Reject the binding.", "fx": [["trust", 1], ["flag", "refusedSeal"]]}, {"x": "Ask what happens if it breaks.", "next": "c4c", "hint": "Demand the truth.", "fx": [["flag", "askedBellTruth"]]}]}, "c4c": {"chapter": "Chapter Four — The First Bell", "passages": [{"k": "n", "x": "Before the rite finished, the fracture spread. The first bell tore from its beam."}, {"k": "n", "x": "For one moment Mara saw beneath the city: a vast shape, neither dead nor sleeping, turning slowly in the dark."}, {"k": "d", "who": "Oren", "x": "“One chain is loose.”"}, {"k": "d", "who": "Sister Ilsa", "x": "“And the Council will know.”"}], "next": "c4d", "fx": [["flag", "firstBellBroken"]]}, "c4d": {"chapter": "Chapter Four — The First Bell", "passages": [{"k": "n", "x": "Chancellor Halvek descended with six guards."}, {"k": "d", "who": "Chancellor Halvek", "x": "“So. The daughter of Elira Venn has finished what her mother began.”"}], "choices": [{"x": "“Tell me what the First is.”", "next": "c5a", "hint": "Force him to speak.", "fx": [["susp", 1], ["flag", "halvekQuestioned"]]}, {"x": "“Arrest me. Ilsa and Oren are innocent.”", "next": "c5a", "hint": "Protect your allies.", "fx": [["trust", 1], ["flag", "protectedAllies"]]}, {"x": "Run.", "next": "c5a", "hint": "Escape.", "fx": [["flag", "ranFromHalvek"]]}]}, "c5a": {"chapter": "Chapter Five — The Ashen Court", "passages": [{"k": "t", "x": "Chapter Five\nThe Ashen Court"}, {"k": "n", "x": "Guards took Mara to the Ashen Court, where the heads of the seven houses sat in a ring around a black stone table."}, {"k": "d", "who": "Halvek", "x": "“The first bell is broken. The binding weakens. And the Keeper’s daughter stands among us.”"}], "next": "c5b"}, "c5b": {"chapter": "Chapter Five — The Ashen Court", "passages": [{"k": "d", "who": "Lord Ashgrave", "x": "“If the First wakes, the city burns.”"}, {"k": "d", "who": "Lord Crowndeep", "x": "“Then the girl must be bound to the door, as her mother should have been.”"}, {"k": "n", "x": "If she still carried the House Ledger, its words rose in her mind: Ash. Debt. Silence. Hunger. Name. Grave. Crown.", "cond": {"op": "has", "item": "House Ledger"}}, {"k": "n", "x": "Without the ledger, Mara had only her mother’s words—and the broken crown stamped into her memory.", "cond": {"op": "nhas", "item": "House Ledger"}}, {"k": "d", "who": "Mara", "x": "“You are not protecting the kingdom. You are protecting a story.”", "cond": {"op": "nhas", "item": "House Ledger"}}], "next": "c5c"}, "c5c": {"chapter": "Chapter Five — The Ashen Court", "passages": [{"k": "n", "x": "Halvek dismissed the guards. His composure cracked into exhaustion."}, {"k": "d", "who": "Chancellor Halvek", "x": "“I was Elira’s friend. She asked me to help destroy the binding. I refused—then spent twenty years making certain no one else could try.”"}, {"k": "d", "who": "Chancellor Halvek", "x": "“The Council wants you bound to the door. I can delay them until dawn if you tell me what Elira found.”"}], "choices": [{"x": "Tell him about the First and the seven lies.", "next": "c6a", "hint": "Trust him.", "fx": [["trust", 1], ["flag", "toldHalvek"]]}, {"x": "Tell him nothing.", "next": "c6a", "hint": "Protect the truth.", "fx": [["susp", 1], ["flag", "silencedHalvek"]]}, {"x": "“Take me to her.”", "next": "c6a", "hint": "Demand your mother.", "fx": [["trust", 1], ["flag", "demandedElira"]]}]}, "c6a": {"chapter": "Chapter Six — The Road Beneath the Kingdom", "passages": [{"k": "t", "x": "Chapter Six\nThe Road Beneath the Kingdom"}, {"k": "n", "x": "Halvek took Mara to Vault Nine, and beyond it to stairs descending farther than any map allowed."}, {"k": "n", "x": "Oren followed, wounded. Ilsa carried a lantern and bell-rope."}, {"k": "d", "who": "Sister Ilsa", "x": "“The Door of Ash lies below. Beyond it, no Keeper has returned.”"}], "next": "c6b"}, "c6b": {"chapter": "Chapter Six — The Road Beneath the Kingdom", "passages": [{"k": "n", "x": "They passed broken crowns, shattered bells, and names scratched into stone by hands that had run out of light."}, {"k": "n", "x": "Beside the tunnel lay a cold camp: a grey cloak, a wooden bowl of rainwater, and fresh footprints in the ash."}, {"k": "d", "who": "Mara", "x": "“My mother’s cloak.”"}], "next": "c6c"}, "c6c": {"chapter": "Chapter Six — The Road Beneath the Kingdom", "passages": [{"k": "n", "x": "Two paths opened: fresh footprints, or an old Keeper’s sigil half-erased in the stone."}], "choices": [{"x": "Follow the footprints.", "next": "c6d", "hint": "Chase hope.", "fx": [["flag", "followedFootprints"]]}, {"x": "Follow the sigil.", "next": "c6d", "hint": "Trust the old path.", "fx": [["flag", "followedSigil"]]}, {"x": "Send Oren to scout.", "next": "c6d", "hint": "Protect him.", "fx": [["trust", 1], ["flag", "sentOren"]]}]}, "c6d": {"chapter": "Chapter Six — The Road Beneath the Kingdom", "passages": [{"k": "n", "x": "Both paths ended at a door of black glass set into living rock."}, {"k": "d", "who": "Elira Venn", "x": "“Mara. Do not open this alone.”"}, {"k": "n", "x": "The door was already opening."}], "next": "c7a"}, "c7a": {"chapter": "Chapter Seven — The Tomb of the First King", "passages": [{"k": "t", "x": "Chapter Seven\nThe Tomb of the First King"}, {"k": "n", "x": "Beyond it lay a cavern with an empty throne of black stone and seven broken bells half-buried in ash."}, {"k": "d", "who": "Ancient Inscription", "x": "“HERE LIES THE FIRST KING. HE WAS NEVER BORN. HE WILL NOT BE ALLOWED TO DIE.”"}], "next": "c7b"}, "c7b": {"chapter": "Chapter Seven — The Tomb of the First King", "passages": [{"k": "n", "x": "There had been no first king. The seven houses had invented him—a story strong enough to bind something older than their kingdom."}, {"k": "n", "x": "The bells were not memorials. They were chains."}, {"k": "n", "x": "The thing beneath Veyr was not a monster that had invaded the world. It was a prisoner the world had decided to forget."}], "next": "c7c"}, "c7c": {"chapter": "Chapter Seven — The Tomb of the First King", "passages": [{"k": "n", "x": "The ash rose into the shape of a man, crowned in broken bronze, its face smooth as a coin worn blank."}, {"k": "d", "who": "The First", "x": "“Keeper’s child. You know the story is a cage. Free me, and I will give you your mother.”"}], "next": "c7d"}, "c7d": {"chapter": "Chapter Seven — The Tomb of the First King", "passages": [{"k": "n", "x": "Oren drew the silver knife. Ilsa gripped her rope. Halvek stood pale at the tunnel mouth."}], "choices": [{"x": "“What happens to my mother if I free you?”", "next": "c8a", "hint": "Refuse the bargain for now.", "fx": [["trust", 1], ["flag", "questionedFirst"]]}, {"x": "“I will not free you.”", "next": "c8a", "hint": "Reject the First.", "fx": [["flag", "refusedFirst"]]}, {"x": "“Show me the truth first.”", "next": "c8a", "hint": "Demand proof.", "fx": [["flag", "demandedProof"]]}]}, "c8a": {"chapter": "Chapter Eight — The Woman Who Waited", "passages": [{"k": "t", "x": "Chapter Eight\nThe Woman Who Waited"}, {"k": "n", "x": "The ash parted, and a grey-cloaked woman stepped from the darkness: older than Mara remembered, but unmistakably her mother."}, {"k": "d", "who": "Mara", "x": "“Mama?”"}, {"k": "d", "who": "Elira Venn", "x": "“I had to let the world believe I died so the Council would stop hunting the truth.”"}], "next": "c8b"}, "c8b": {"chapter": "Chapter Eight — The Woman Who Waited", "passages": [{"k": "d", "who": "Elira Venn", "x": "“Oren is a Keeper from a future that has already happened. In his time, you opened this door alone, and the First used your grief to break the last bell.”"}, {"k": "d", "who": "Oren", "x": "“I am the reason your mother died because my coming here drew the Council to her.”"}], "next": "c8c"}, "c8c": {"chapter": "Chapter Eight — The Woman Who Waited", "passages": [{"k": "n", "x": "Elira placed the blackened token in Mara’s palm."}, {"k": "d", "who": "Elira Venn", "x": "“One bell remains  "Grey-Leather Chronicle"}}, {"k": "d", "who": "Elira Venn", "x": "“Ask it what it was called before Veyr learned to fear it.”", "cond": {"op": "has", "item": "Grey-Leather Chronicle"}}, {"k": "n", "x": "Without the chronicle, Mara had only the token and the First’s own words.", "cond": {"op": "nhas", "item": "Grey-Leather Chronicle"}}, {"k": "d", "who": "Mara", "x": "“What were you called before Veyr learned to fear you?”", "cond": {"op": "nhas", "item": "Grey-Leather Chronicle"}}], "next": "c9c"}, "c9c": {"chapter": "Chapter Nine — The Breaking of the Bells", "passages": [{"k": "d", "who": "The First", "x": "“I was called Vael. Before your houses built their thrones.”"}, {"k": "n", "x": "The name settled into the ash like a key entering a lock. Above, three more bells broke."}, {"k": "d", "who": "Sister Ilsa", "x": "“The tenth bell must be rung before the seventh falls!”"}], "next": "c9d"}, "c9d": {"chapter": "Chapter Nine — The Breaking of the Bells", "passages": [{"k": "n", "x": "Ilsa drove the bell-rope into the ash. Oren marked the circle with his blood. Elira placed the token at its centre."}, {"k": "n", "x": "Halvek set the royal seal beside it.", "cond": {"op": "susp_lt", "value": 3}}, {"k": "n", "x": "Halvek’s guards raised their weapons.", "cond": {"op": "susp_ge", "value": 3}}, {"k": "d", "who": "Elira Venn", "x": "“Then stop me properly this time, Halvek. Or help me.”", "cond": {"op": "susp_ge", "value": 3}}, {"k": "n", "x": "The ash trembled. The sixth bell broke."}], "next": "c10a"}, "c10a": {"chapter": "Chapter Ten — The Tenth Bell", "passages": [{"k": "t", "x": "Chapter Ten\nThe Tenth Bell"}, {"k": "n", "x": "The ash-bell stood complete: translucent, soundless, waiting."}, {"k": "d", "who": "The First", "x": "“Ring it, Mara Venn. Or bury me again.”"}], "choices": [{"x": "Ring the tenth bell.", "next": "endTenth", "hint": "End the lie.", "fx": [["flag", "rangTenth"]]}, {"x": "Seal the Door of Ash forever.", "next": "endSeal", "hint": "Preserve the kingdom.", "fx": [["flag", "sealedDoor"]]}, {"x": "Burn the chronicle and walk away.", "next": "endAsh", "hint": "Abandon Veyr’s truth.", "fx": [["lose", "Grey-Leather Chronicle"], ["flag", "burnedChronicle"]]}, {"x": "Give the crown token to Elira.", "next": "endMother", "hint": "Return the choice to your mother.", "fx": [["lose", "Blackened Wooden Token"], ["flag", "gaveTokenToElira"]]}]}, "endTenth": {"chapter": "Chapter Ten — The Tenth Bell", "passages": [{"k": "n", "x": "Mara struck the ash-bell. It rang like a word finally spoken after a thousand years of silence."}, {"k": "d", "who": "Mara", "x": "“Vael.”"}, {"k": "n", "x": "The tomb filled with light—not fire, but recognition. The remaining bells rang once, together, then fell silent as mourners."}, {"k": "n", "x": "The seven houses lost their thrones. Veyr woke, grieving and unsteady, into a history it had never been allowed to know."}, {"k": "n", "x": "Mara became the first Archivist of the Truth."}, {"k": "d", "who": "The Ashen Chronicle", "x": "“The first king was a lie. The First was named Vael. And the child of ash chose to remember.”"}, {"k": "t", "x": "The End"}], "next": "title", "ending": true}, "endSeal": {"chapter": "Chapter Ten — The Tenth Bell", "passages": [{"k": "n", "x": "Mara pressed her hand to the Door of Ash and spoke the Keeper’s word."}, {"k": "n", "x": "The ash-bell dissolved. The tunnels closed. The First screamed in the long, patient anger of something being forgotten again."}, {"k": "n", "x": "Veyr survived. The houses kept their thrones. Mara became Keeper of Vault Nine."}, {"k": "n", "x": "But every night, she placed her hand against the floor and listened."}, {"k": "d", "who": "The Ashen Chronicle", "x": "“Beneath the palace, something patient waited for the next child to ask why the bells had stopped.”"}, {"k": "t", "x": "The End"}], "next": "title", "ending": true}, "endAsh": {"chapter": "Chapter Ten — The Tenth Bell", "passages": [{"k": "n", "x": "Mara fed the chronicle to the tomb’s cold fire. The pages burned green, then blue, leaving only rain and smoke."}, {"k": "d", "who": "The First", "x": "“You choose the story. As they did.”"}, {"k": "n", "x": "Mara left Veyr before sunrise, changed her name, and never touched a bell again."}, {"k": "n", "x": "Yet some nights, in strange cities, she heard a child singing—and could not stop herself from listening."}, {"k": "t", "x": "The End"}], "next": "title", "ending": true}, "endMother": {"chapter": "Chapter Ten — The Tenth Bell", "passages": [{"k": "n", "x": "Mara placed the token in Elira’s hand."}, {"k": "d", "who": "Mara", "x": "“You waited twenty years to make this choice. I will not take it from you.”"}, {"k": "n", "x": "Elira wept, then spoke the First’s true name into the ash."}, {"k": "d", "who": "Elira Venn", "x": "“Vael.”"}, {"k": "n", "x": "The tomb exhaled. The binding changed—not broken, but rewritten: no longer a prison built on a lie, but a vigil kept by choice."}, {"k": "n", "x": "Mother and daughter climbed toward the light together."}, {"k": "t", "x": "The End"}], "next": "title", "ending": true}}};
const DEFAULT_STATE=()=>({scene:STORY.start,trustOren:0,suspicion:0,flags:{},inventory:[],visited:[]});
function condOk(s,c){if(!c)return true;if(c.op==='has')return s.inventory.includes(c.item);if(c.op==='nhas')return!s.inventory.includes(c.item);if(c.op==='susp_lt')return s.suspicion<c.value;if(c.op==='susp_ge')return s.suspicion>=c.value;return true}
function applyFx(s,fx){(fx||[]).forEach(f=>{const[k,v]=f;if(k==='trust')s.trustOren+=v;else if(k==='susp')s.suspicion+=v;else if(k==='flag')s.flags[v]=true;else if(k==='gain'&&!s.inventory.includes(v))s.inventory.push(v);else if(k==='lose'){const i=s.inventory.indexOf(v);if(i>-1)s.inventory.splice(i,1)}})}
function esc(x){return String(x).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"')}
function expireRewards(){const raw=store.getItem('ashen_rewards');if(!raw)return;const r=JSON.parse(raw);const now=Date.now();let changed=false;Object.keys(r).forEach(k=>{if(r[k].expires&&r[k].expires<now){changed=true;delete r[k]}});if(changed)store.setItem('ashen_rewards',JSON.stringify(r));}
function activeRewards(){expireRewards();const raw=store.getItem('ashen_rewards');return raw?JSON.parse(raw):{}}

ce';b.textContent='Continue';b.addEventListener('click',()=>Game.goto(sc.next));ch.appendChild(b)}stage.scrollTop=0;store.setItem('ashen_auto',JSON.stringify({state:this.state,ts:Date.now()}));UI.refreshContinue()},goto(id){const sc=STORY.scenes[id];if(!sc)return UI.toast('Missing scene: '+id);this.state.scene=id;applyFx(this.state,sc.fx);if(!this.state.visited.includes(id))this.state.visited.push(id);this.render()}};

'<p class="creator-note"><strong>Active rewards</strong></p>'+(rewardHtml||'<p class="creator-note">No time-limited rewards are active.</p>')+

'<div class="row"><button data-a="close">Close</button><button data-a="restart">Restart Story</button></div>';}
else if(kind==='load'){h='<h2>Load Game</h2>';let any=false;for(let i=1;i<=3;i++){const d=store.getItem('ashen_save_'+i);if(d){any=true;const o=JSON.parse(d);h+='<div class="save-item"><span>Slot '+i+' — '+new Date(o.ts).toLocaleString()+'</span><button data-load="'+i+'">Load</button></div>'}}if(!any)h+='<p class="credits">No saved journeys found.</p>';h+='<div class="row"><button data-a="close">Close</button></div>'}
else if(kind==='inventory'){h='<h2>Inventory</h2>';const inv=Game.state?Game.state.inventory:[];if(!inv.length)h+='<p class="credits">Your hands are empty.</p>';else inv.forEach(i=>h+='<div class="inv-item"><span>'+esc(i)+'</span></div>');const rw=activeRewards();Object.keys(rw).forEach(k=>{h+='<div class="inv-item"><span>'+esc(rw[k].item)+' (time-limited)</span><span>expires '+new Date(rw[k].expires).toLocaleString()+'</span></div>'});h+='<div class="row"><button data-a="close">Close</button></div>'}
else if(kind==='chapters'){h='<h2>Chapters</h2><div class="credits">';for(let i=1;i<=10;i++)h+='<p>Chapter '+i+'</p>';h+='<p><em>Chapter Ten concludes the story.</em></p></div><div class="row"><button data-a="close">Close</button></div>'}
else if(kind==='credits')h='<h2>Credits</h2><div class="credits"><p><strong>The Ashen Crown</strong></p><p>Created by Casey Achiamani</p><p>Story and world: provided by the author.</p><p>Interactive adaptation: Perplexity.</p></div><div class="row"><button data-a="close">Close</button></div>';
else if(kind==='menu')h='<h2>Menu</h2><div class="row" style="flex-direction:column"><button data-a="close">Resume</button><button data-a="save">Save Journey</button><button data-a="load">Load Game</button><button data-a="inventory">Inventory</button><button data-a="settings">Settings</button><button data-a="title">Return to Title</button><button data-a="restart">Restart Story</button></div>';
box.innerHTML=h;document.getElementById('modal').classList.add('active');
const unlock=document.getElementById('cUnlock');if(unlock)unlock.addEventListener('click',()=>{const code=document.getElementById('cCode').value;const btn=unlock;btn.textContent='Checking…';fetch('/.netlify/functions/creator-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})}).then(r=>r.json()).then(j=>{if(j.ok){store.setItem('ashen_creator','1');UI.open('creator')}else{btn.textContent='Unlock';UI.toast(j.error||'Incorrect passcode.')}}).catch(()=>{btn.textContent='Unlock';UI.toast('Could not reach the login server.')})});
const redeem=document.getElementById('rRedeem');if(redeem)redeem.addEventListener('click',()=>{const code=document.getElementById('rCode').value.trim().toUpperCase();const res=document.getElementById('rResult');const cfg=REDEEM_CODES[code];if(!cfg){res.textContent='That code is not recognised.';return}const r=activeRewards();if(r[code]){res.textContent='That code has already been redeemed.';return}r[code]={item:cfg.item,expires:Date.now()+cfg.hours*3600000};store.setItem('ashen_rewards',JSON.stringify(r));if(cfg.item==='A Handful of Roses'){res.innerHTML='<div style="font-family:monospace;font-size:10px;line-height:10px;color:#e05a7a;white-space:pre">     .-.\n    (   )\n   (  🌹  )\n    `-.-`\n  A Handful of Roses</div><div style="margin-top:6px">Redeemed: '+cfg.item+' for '+cfg.hours+' hours.</div>';}else if(cfg.item==='The Heart of a Poet'){res.innerHTML='<div style="font-family:Georgia,serif;font-size:12px;line-height:18px;color:#c9a227;white-space:pre-wrap;max-width:420px;margin:0 auto;text-align:center">\n“Beneath the quiet of the evening sky,\nyour name becomes a soft, unspoken rhyme.\nAnd every thought I send toward you tonight\nbecomes a little poem, kept in time.”\n\n— For you, always.</div>';}else{res.innerHTML='Redeemed: '+cfg.item+' for '+cfg.hours+' hours.';}});
box.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{if(!Game.state)Game.newGame();Game.goto(b.dataset.jump);UI.close()}));
box.querySelectorAll('[data-adj]').forEach(b=>b.addEventListener('click',()=>{const[k,v]=b.dataset.adj.split(':');if(!Game.state)Game.newGame();if(k==='trust')Game.state.trustOren+=+v;else Game.state.suspicion+=+v;Game.render();UI.open('creator')}));
box.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>{const item=document.getElementById('cItem').value;if(!Game.state)Game.newGame();if(b.dataset.item==='add'){if(!Game.state.inventory.includes(item))Game.state.inventory.push(item)}else{const i=Game.state.inventory.indexOf(item);if(i>-1)Game.state.inventory.splice(i,1)}Game.render();UI.open('creator')}));
box.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.a;if(a==='close')UI.close();else if(a==='restart'){UI.close();Game.newGame()}else if(a==='save'){Game.saveGame(1);UI.close()}else if(a==='load')UI.open('load');else if(a==='inventory')UI.open('inventory');else if(a==='settings')UI.open('settings');else if(a==='title'){Game.saveGame(1);UI.close();Game.show('title');UI.refreshContinue()}}));
box.querySelectorAll('[data-load]').forEach(b=>b.addEventListener('click',()=>Game.loadSlot(+b.dataset.load)))},
close(){document.getElementById('modal').classList.remove('active')},
toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#12151a;border:1px solid #d8a24a;color:#d8a24a;padding:9px 16px;font-size:.78rem;z-index:50';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)},
refreshContinue(){document.getElementById('btnContinue').disabled=!store.getItem('ashen_auto')}};
document.getElementById('btnNew').addEventListener('click',()=>Game.newGame());document.getElementById('btnContinue').addEventListener('click',()=>Game.continueGame());document.getElementById('btnLoad').addEventListener('click',()=>UI.open('load'));document.getElementById('btnChapters').addEventListener('click',()=>UI.open('chapters'));document.getElementById('btnSettings').addEventListener('click',()=>UI.open('settings'));document.getElementById('btnCredits').addEventListener('click',()=>UI.open('credits'));document.getElementById('btnInv').addEventListener('click',()=>UI.open('inventory'));document.getElementById('btnSave').addEventListener('click',()=>Game.saveGame(1));document.getElementById('btnMenu').addEventListener('click',()=>UI.open('menu'));document.addEventListener('keydown',e=>{if(e.key==='Escape')UI.close()});const ash=document.getElementById('ash');for(let i=0;i<40;i++){const sp=document.createElement('span');sp.style.left=(Math.random()*100)+'%';sp.style.animationDuration=(9+Math.random()*14)+'s';sp.style.animationDelay=(-Math.random()*20)+'s';ash.appendChild(sp)}expireRewards();UI.refreshContinue();
</script></body></html>
